name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:

  runAction:
    runs-on: ubuntu-latest
    name: Run The Action

    permissions:
      checks: write
      pull-requests: write

    steps:

      - name: Fetch Sources
        uses: actions/checkout@v7

      - name: Default Settings
        id: run-action
        uses: ./
        with:
          plugin-id: "it.czerwinski.intellij.wavefront"
          plugin-version: "1.3.0"
          plugin-verifier-report-path: "${{ github.workspace }}/test-data/build/reports/pluginVerifier"

      - name: Only Report
        id: only-report
        uses: ./
        with:
          plugin-id: "it.czerwinski.intellij.wavefront"
          plugin-version: "1.3.0"
          plugin-verifier-report-path: "${{ github.workspace }}/test-data/build/reports/pluginVerifier"
          publish-summary: false
          report-title: Only Report
          pr-comment-id: intellij-plugin-verifier-only-report

      - name: Only Comment
        id: only-comment
        uses: ./
        with:
          plugin-id: "it.czerwinski.intellij.wavefront"
          plugin-version: "1.3.0"
          plugin-verifier-report-path: "${{ github.workspace }}/test-data/build/reports/pluginVerifier"
          publish-report: false
          report-title: Only Comment
          pr-comment-id: intellij-plugin-verifier-only-comment
